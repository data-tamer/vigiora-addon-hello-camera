# How Vigiora runs this add-on. Vigiora Server and the Vigiora cloud check this file against the manifest, and
# the rules are an allow-list: a key that is not allowed is refused. In short: no "$" variable anywhere (write
# real values); a service with "build:" has no "image:"; no bind mounts at all (the add-on keeps files in a named
# volume declared below, and code goes in the image); names are lower case letters, digits and "-"; labels start
# with "vigiora.addon."; every environment value is written out; no Docker socket; no privileged mode unless the
# manifest says run.privileged: true; no network_mode: host unless the manifest says run.network: host. The
# Dockerfile is checked too (every FROM pinned by digest). Run  vigiora-addon validate .  to see them all.
#
# What the server adds when it installs this file is described in the add-on template's README ("How the server starts it"): the
# server address, the enrolment key file and the service name. They are not written here.
volumes:
  addon-state:                    # the add-on's own files. The server creates it for this add-on alone and keeps it
                                  # across updates; it is removed with the add-on.
services:
  hello-camera:
    build:
      context: .                  # run.source is "build": the server builds this folder's Dockerfile
                                  # (and names the image itself, so there is no "image:" here)
    restart: unless-stopped
    environment:
      HELLO_INTERVAL_SEC: "30"
      LOG_LEVEL: INFO
    volumes:
      - addon-state:/data         # the add-on keeps its token here
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
