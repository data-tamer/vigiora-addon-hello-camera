# How Vigiora runs this add-on. Vigiora Server and the Vigiora cloud check this file against the manifest, and
# the rules are an allow-list: a key that is not allowed is refused. In short: no "$" variable anywhere (write
# real values); a service with "build:" has no "image:"; a folder of this repository is mounted read-only (":ro")
# unless it is ./data, the add-on's own writable folder; no Docker socket, no host paths such as /etc or /var/run;
# no privileged mode unless the manifest says run.privileged: true; no network_mode: host unless the manifest says
# run.network: host. Run  vigiora-addon validate .  to see them all.
#
# What the server adds when it installs this file is described in README.md ("How the server starts it"): the
# server address, the enrolment key file and the service name. They are not written here.
services:
  hello-camera:
    build:
      context: .                  # run.source is "build": the server builds this folder's Dockerfile
                                  # (and names the image itself, so there is no "image:" here)
    restart: unless-stopped
    environment:
      HELLO_INTERVAL_SEC: "30"
      LOG_LEVEL: INFO
    volumes:
      - ./data:/data              # the add-on keeps its token here. The server creates ./data (empty on install,
                                  # kept on update). It is the only folder of the repository that may be writable.
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
